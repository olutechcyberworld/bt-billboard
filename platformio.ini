[env:bt_billboard]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

board_build.partitions = min_spiffs.csv

monitor_speed  = 115200
upload_speed   = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    majicdesigns/MD_Parola     @ ^3.7.3
    majicdesigns/MD_MAX72XX    @ ^3.5.1
    adafruit/RTClib            @ ^2.1.4
    tzapu/WiFiManager          @ ^2.0.17
    links2004/WebSockets       @ ^2.4.1

; Wireless upload target: use this env instead of the one above when the
; device is already running this firmware (or any build with ArduinoOTA
; enabled) and reachable on the network, so you don't need a USB cable for
; every iteration. Select it explicitly:
;   pio run -e bt_billboard_ota -t upload
; upload_port takes either the mDNS hostname shown on the device's own
; panel after it connects (bt-billboard-<id>.local) or a plain IP address --
; swap in whichever you're actually using, since the per-device hex suffix
; is different on every unit. upload_flags supplies the OTA password
; (config.h's OTA_PASSWORD) that ArduinoOTA.setPassword() now requires;
; keep the two in sync if you change the default placeholder in config.h.
[env:bt_billboard_ota]
extends       = env:bt_billboard
upload_protocol = espota
upload_port     = bt-billboard-XXXXXX.local
upload_flags    =
    --auth=billboard-ota